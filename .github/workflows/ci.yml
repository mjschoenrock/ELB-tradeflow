name: TradeFlow CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint placeholder
        working-directory: frontend
        run: |
          npm ci
          npm run build

  backend-build-test:
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tradeflow_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tradeflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + run unit tests
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Liquibase status (informational)
        working-directory: backend
        run: >
          ./mvnw -B liquibase:status
          -Dliquibase.url=jdbc:postgresql://localhost:5432/tradeflow_test
          -Dliquibase.username=ci
          -Dliquibase.password=ci
          -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.xml

      - name: Liquibase validate
        working-directory: backend
        run: >
          ./mvnw -B liquibase:validate
          -Dliquibase.url=jdbc:postgresql://localhost:5432/tradeflow_test
          -Dliquibase.username=ci
          -Dliquibase.password=ci
          -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: warn

  frontend-build-test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    needs: [backend-build-test, frontend-build-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/tradeflow-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tradeflow-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/tradeflow-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tradeflow-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
